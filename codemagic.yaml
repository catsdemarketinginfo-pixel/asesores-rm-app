workflows:
  ios-app-store:
    name: iOS App Store Release
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store  # <-- Corregido: guión bajo, no guión
        bundle_identifier: com.example.agilizadorRmApp
    scripts:
      - name: Deshabilitar Swift Package Manager
        script: flutter config --no-enable-swift-package-manager
      
      - name: Instalar dependencias
        script: |
          flutter clean
          flutter pub get
          cd ios && pod install && cd ..
      
      - name: Compilar iOS para App Store
        script: |
          flutter build ipa --release --export-options-plist=ios/export_options.plist
    
    artifacts:
      - build/ios/ipa/*.ipa
    
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true